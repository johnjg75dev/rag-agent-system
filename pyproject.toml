[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-system"
version = "1.0.0"
authors = [
    {name = "Alphabit Labs", email = "contact@alphabitlabs.com"}
]
description = "RAG (Retrieval-Augmented Generation) Agent System with FastAPI, pgvector, and Celery"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.2",
    "celery[redis]>=5.5.1",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.40",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.0",
    "sentence-transformers>=4.1.0",
    "torch>=2.6.0",
    "transformers>=4.51.1",
    "scikit-learn>=1.6",
    "umap-learn>=0.5.8",
    "plotly>=6.0.5",
    "structlog>=25.2.0",
    "python-multipart>=0.0.27",
    "python-dotenv>=1.1.0",
    "alembic>=1.15.2",
    "numpy>=1.26.0",
]

[project.scripts]
rag-agent = "backend.app:app"

[project.urls]
Homepage = "https://github.com/alphabitlabs/rag-agent-system"
Repository = "https://github.com/alphabitlabs/rag-agent-system"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "rag*"]
